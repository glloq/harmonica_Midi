; ============================================================================
;  Harmonica MIDI modulaire — configuration PlatformIO
; ----------------------------------------------------------------------------
;  Deux environnements :
;   - esp32dev    : firmware pour ESP32 classique (WROOM-32), LittleFS + web.
;   - native      : compilation de la LOGIQUE PURE sur PC (tests Unity, mock
;                   HAL) sans matériel ni pile Arduino. Voir docs/architecture_fr.md
; ============================================================================

[platformio]
default_envs = esp32dev

; ---- Réglages communs -------------------------------------------------------
[env]
build_flags = -std=gnu++17 -Wall
monitor_speed = 115200

; ---- Cible matérielle : ESP32 classique ------------------------------------
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = partitions_huge.csv
build_flags =
  ${env.build_flags}
  -DHARM_ARDUINO=1
lib_deps =
  bblanchon/ArduinoJson@^7.0.0
  adafruit/Adafruit PWM Servo Driver Library@^3.0.0
  waspinator/AccelStepper@^1.64
  adafruit/Adafruit BMP280 Library@^2.6.8
  adafruit/Adafruit Unified Sensor@^1.1.14
  ; --- sans-fil / web (chargés seulement pour la cible ESP32) ---
  mathieucarbou/ESPAsyncWebServer@^3.3.0
  h2zero/NimBLE-Arduino@^1.4.2
  lathoub/Arduino-BLE-MIDI@^2.2
  lathoub/AppleMIDI@^3.3.0

; ---- Cible hôte (PC) : logique pure + tests --------------------------------
;  Compile uniquement le "cœur" (Types, Config, HarmonicaMap, NoteEngine,
;  air/valve + HAL mock). Les en-têtes Arduino sont exclus via #if HARM_ARDUINO.
[env:native]
platform = native
test_build_src = yes          ; compile src/ dans les tests (main() exclu via PIO_UNIT_TESTING)
build_flags =
  ${env.build_flags}
  -DHARM_NATIVE=1
  -DHARM_MOCK=1
  -I include
lib_deps =
  bblanchon/ArduinoJson@^7.0.0
