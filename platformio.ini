; ============================================================================
;  Harmonica MIDI modulaire — configuration PlatformIO
; ----------------------------------------------------------------------------
;  Deux environnements :
;   - esp32dev    : firmware pour ESP32 classique (WROOM-32), LittleFS + web.
;   - native      : compilation de la LOGIQUE PURE sur PC (tests Unity, mock
;                   HAL) sans matériel ni pile Arduino. Voir docs/architecture_fr.md
; ============================================================================

[platformio]
default_envs = esp32dev

; ---- Réglages communs -------------------------------------------------------
[env]
build_flags = -std=gnu++17 -Wall
monitor_speed = 115200

; ---- Cible matérielle : ESP32 classique ------------------------------------
[env:esp32dev]
; Plateforme épinglée sur la génération Arduino-core 2.0.x / IDF4 : c'est le
; monde compatible avec NimBLE 1.4.x + Arduino-BLE-MIDI 2.2. NE PAS passer à
; une plateforme core-3 sans migrer NimBLE en 2.x (voir docs/architecture_fr.md).
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = partitions_huge.csv
build_flags =
  ${env.build_flags}
  -DHARM_ARDUINO=1
lib_deps =
  bblanchon/ArduinoJson@^7.2.1
  adafruit/Adafruit PWM Servo Driver Library@^3.0.0
  waspinator/AccelStepper@^1.64
  adafruit/Adafruit BMP280 Library@^2.6.8
  adafruit/Adafruit Unified Sensor@^1.1.14
  ; --- sans-fil / web (chargés seulement pour la cible ESP32) ---
  ; NOTE : versions à valider au 1er build avec accès au registre PlatformIO.
  ; ESPAsyncWebServer 3.x le plus récent cible core-3 ; garder une version
  ; compatible core-2 si le build échoue (ex. épingler une 3.1.x).
  mathieucarbou/ESPAsyncWebServer@^3.1.0
  h2zero/NimBLE-Arduino@^1.4.2
  lathoub/Arduino-BLE-MIDI@^2.2
  lathoub/AppleMIDI@^3.2.0

; ---- Cible hôte (PC) : logique pure + tests --------------------------------
;  Compile uniquement le "cœur" (Types, Config, HarmonicaMap, NoteEngine,
;  air/valve + HAL mock). Les en-têtes Arduino sont exclus via #if HARM_ARDUINO.
[env:native]
platform = native
test_build_src = yes          ; compile src/ dans les tests (main() exclu via PIO_UNIT_TESTING)
build_flags =
  ${env.build_flags}
  -DHARM_NATIVE=1
  -DHARM_MOCK=1
  -I include
lib_deps =
  bblanchon/ArduinoJson@^7.0.0
