<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Harmonica MIDI — Configuration</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>🎵 Harmonica MIDI</h1>
    <div class="hdr-right">
      <span id="dirty" class="dirty"></span>
      <span id="conn" class="badge off">hors ligne</span>
      <button id="btn-panic" class="warn" title="Coupe toutes les notes et referme les valves">⏹ Tout couper</button>
    </div>
  </header>

  <nav id="tabs" class="tabs"></nav>

  <main id="content">
    <section class="card"><p class="muted">Chargement de la configuration…</p></section>
  </main>

  <footer class="actionbar">
    <button id="btn-reload">Recharger depuis le contrôleur</button>
    <button id="btn-save" class="primary">Sauvegarder la configuration</button>
    <button id="btn-reboot" class="warn">Redémarrer</button>
    <small>Le mapping de l’harmonica s’applique à chaud ; le câblage (air, valves, MIDI) prend effet au redémarrage.</small>
  </footer>

  <div id="toast" class="toast"></div>

  <!-- schema.js décrit la configuration, app.js la rend. -->
  <script src="/schema.js"></script>
  <script src="/app.js"></script>
</body>
</html>
